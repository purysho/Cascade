<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
<title id="title">Cascade — regain control before the city falls apart</title>
<desc id="desc">A dark municipal control grid split between unsafe orange AI cascades and regulated mint infrastructure.</desc>
