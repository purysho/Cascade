name: Engine verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run browser:smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: |
            verification/browser-smoke.png
            verification/tutorial-smoke.png
          if-no-files-found: ignore
