name: Engine and release verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run browser:smoke
      - run: npm run stage5:smoke
      - run: npm run launch:capture
      - name: Install FFmpeg for launch trailer
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run launch:video
      - run: npm run release
        env:
          CASCADE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: |
            verification/browser-smoke.png
            verification/tutorial-smoke.png
            verification/stage4-feedback.png
            verification/stage5-win.png
            verification/stage5-loss.png
            verification/stage5-conflict.png
            verification/stage5-zoom-200.png
            verification/stage5-1920.png
            verification/release-file-smoke.png
            verification/public-launch/*.png
            brag-output/brag.jpg
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cascade-launch-video
          path: |
            brag-output/brag.mp4
            brag-output/brag.jpg
            brag-output/brag-plan.md
            brag-output/composition-brief.md
            brag-output/share-copy.txt
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cascade-release
          path: |
            release/Cascade-Play.html
            release/Cascade-v0.6.0.zip
            release/BUILD-MANIFEST.json
            release/README-FIRST.txt
            release/CREDITS.txt
            release/AI-DISCLOSURE.txt
            release/VERIFICATION.txt
            release/release-report.json
          if-no-files-found: error

  windows-engine:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run package
        env:
          CASCADE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: npm run release:verify

  windows-browser:
    runs-on: windows-2025
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [edge, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run web:build
      - run: npm run platform:smoke
        env:
          CASCADE_BROWSER: ${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.browser }}-smoke
          path: verification/platform-win32-${{ matrix.browser }}.png
          if-no-files-found: ignore
