name: Engine and release verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run browser:smoke
      - run: npm run stage5:smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: |
            verification/browser-smoke.png
            verification/tutorial-smoke.png
            verification/stage4-feedback.png
            verification/stage5-win.png
            verification/stage5-loss.png
            verification/stage5-conflict.png
            verification/stage5-zoom-200.png
            verification/stage5-1920.png
          if-no-files-found: ignore

  windows-engine:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check

  windows-browser:
    runs-on: windows-2025
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [edge, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run web:build
      - run: npm run platform:smoke
        env:
          CASCADE_BROWSER: ${{ matrix.browser }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.browser }}-smoke
          path: verification/platform-win32-${{ matrix.browser }}.png
          if-no-files-found: ignore
