name: Deploy Cascade to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run web:build
      - run: npm run launch:capture
      - name: Install FFmpeg for launch trailer
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run launch:video
      - name: Add launch media
        run: |
          mkdir -p dist-web/media
          cp verification/public-launch/*.png dist-web/media/
          cp brag-output/brag.mp4 dist-web/media/
          cp brag-output/brag.jpg dist-web/media/
          cp brag-output/share-copy.txt dist-web/media/
      - name: Add Pages metadata
        run: |
          touch dist-web/.nojekyll
          cat > dist-web/404.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./">
          <title>Cascade</title>
          EOF
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
